apiVersion: batch/v1
kind: Job
metadata:
  name: proptech-migrate-v001
  labels:
    app.kubernetes.io/name: proptech-migrate
    app.kubernetes.io/part-of: proptech-platform
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proptech-migrate
        app.kubernetes.io/part-of: proptech-platform
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: proptech-platform:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/scripts/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: proptech-runtime
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
