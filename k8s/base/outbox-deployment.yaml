apiVersion: apps/v1
kind: Deployment
metadata:
  name: proptech-outbox
  labels:
    app.kubernetes.io/name: proptech-outbox
    app.kubernetes.io/part-of: proptech-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: proptech-outbox
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proptech-outbox
        app.kubernetes.io/part-of: proptech-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: proptech-outbox
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox
          image: proptech-platform:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/src/workers/outbox-relay.js"]
          envFrom:
            - configMapRef:
                name: proptech-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: proptech-runtime
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: proptech-runtime
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
